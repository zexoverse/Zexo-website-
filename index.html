<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="description" content="ZEXO — Minecraft texture packs, add-ons, skins and digital products."><title>ZEXO — Minecraft Marketplace</title><style>
:root{--bg:#171819;--card:#202225;--card2:#292c30;--line:#34383d;--g:#62d64d;--gl:#a2f58b;--muted:#aeb4b6;--dark:#101112}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{width:min(680px,100%);min-height:100vh;margin:auto;background:var(--bg);padding-bottom:86px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:2px solid #25282b;background:#171819;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:1000;font-size:21px;letter-spacing:1px}.mark{width:28px;height:28px;background:var(--g);color:#091208;display:grid;place-items:center;clip-path:polygon(0 5px,5px 5px,5px 0,calc(100% - 5px) 0,calc(100% - 5px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 5px) calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 5px),0 calc(100% - 5px));box-shadow:0 4px #287a24}.brand em{color:var(--g);font-style:normal}.balance{background:#252b27;border:2px solid #3b4540;padding:7px 10px;font-size:12px;font-weight:900;color:var(--gl)}main{padding:15px 14px 30px}.view{display:none}.view.active{display:block}.title{display:flex;justify-content:space-between;align-items:center;margin:12px 0 14px}.title h1{font-size:27px;margin:0;font-weight:1000;text-shadow:2px 2px #090a0b}.sub{color:var(--muted);font-size:13px;line-height:1.45;margin:-7px 0 15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{position:relative;background:var(--card);border:3px solid var(--line);box-shadow:0 5px #101112,0 8px #303337;min-height:112px;padding:12px;text-align:left;overflow:hidden}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff08,transparent 55%);pointer-events:none}.card .emoji{font-size:39px;display:block;text-align:center;margin-bottom:7px;filter:drop-shadow(3px 4px #0008)}.card b{font-size:15px;display:block;text-shadow:2px 2px #000}.card small{color:#c8cccd}.green{background:linear-gradient(#347b3d,#17351e)}.blue{background:linear-gradient(#2e83c1,#174b72)}.pink{background:linear-gradient(#d33c68,#76142e)}.gold{background:linear-gradient(#a9782d,#4b3216)}.purple{background:linear-gradient(#684b91,#30234e)}.wide{grid-column:1/-1}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section h2{font-size:16px;margin:0;font-weight:1000;text-shadow:2px 2px #000}.link{background:none;color:var(--g);font-size:11px;font-weight:900}.row{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);box-shadow:0 4px #101112;padding:10px;margin:9px 0;min-height:72px}.row .ico{font-size:28px;width:38px;text-align:center}.row .info{flex:1;min-width:0}.row b{font-size:13px;display:block}.row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.btn{background:var(--g);color:#071307;border:3px solid #91f47d;padding:8px 11px;font-size:10px;font-weight:1000;clip-path:polygon(0 5px,5px 5px,5px 0,calc(100% - 5px) 0,calc(100% - 5px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 5px) calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 5px),0 calc(100% - 5px));box-shadow:0 5px #287a24,0 7px #101510}.btn:active{transform:translateY(3px);box-shadow:0 1px #287a24}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 10px}.chip{white-space:nowrap;background:#222528;border:2px solid var(--line);box-shadow:0 3px #0e0f10;padding:8px 12px;font-size:11px;font-weight:900}.chip.on{background:var(--g);color:#071307;border-color:#91f47d;box-shadow:0 4px #287a24}.search{display:flex;gap:8px;margin-bottom:10px}.search input{width:100%;height:44px;background:var(--card);border:2px solid var(--line);color:#fff;padding:0 12px;outline:none}.search input:focus{border-color:var(--g)}.pack{background:var(--card);border:3px solid var(--line);box-shadow:0 5px #101112;margin-bottom:10px;overflow:hidden}.pack .art{height:135px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#245e35,#182a1c)}.pack .body{padding:11px}.pack h3{margin:0 0 4px;font-size:15px}.pack p{margin:0 0 8px;color:var(--muted);font-size:11px}.tag{display:inline-block;background:#111416;border:1px solid #363b3e;padding:3px 7px;margin-right:4px;font-size:9px;color:#d9ddde}.skin-stage{height:285px;background:linear-gradient(180deg,#202225,#151617);border:3px solid var(--line);box-shadow:0 5px #101112;position:relative;display:grid;place-items:center;margin-bottom:12px;overflow:hidden}.skin{font-size:116px;filter:drop-shadow(6px 7px #0009)}.poses{position:absolute;right:8px;top:8px;display:grid;gap:6px}.poses button{background:#2b2f32;border:2px solid #454b4e;padding:7px 10px;font-size:10px;font-weight:900}.poses button.on{background:#284b24;color:var(--gl);border-color:var(--g)}.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}.skin-card{background:var(--card);border:3px solid var(--line);box-shadow:0 4px #101112;padding:10px;text-align:left}.skin-card .face{height:135px;background:#151718;display:grid;place-items:center;font-size:66px;margin-bottom:8px}.skin-card b{font-size:12px;display:block}.skin-card small{color:var(--muted);font-size:10px}.coin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.coin{background:var(--card);border:3px solid var(--line);box-shadow:0 4px #101112;padding:10px;text-align:center;position:relative}.coin .gem{font-size:42px;display:block;margin:3px}.coin b{display:block;font-size:15px}.coin small{color:var(--muted);display:block;margin:3px 0 9px}.coin .btn{width:100%}.product{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);box-shadow:0 4px #101112;padding:10px;margin:9px 0}.product .art{width:55px;height:55px;background:linear-gradient(135deg,#345f3b,#18271c);display:grid;place-items:center;font-size:29px}.product .info{flex:1}.product b{font-size:12px}.product p{font-size:10px;color:var(--muted);margin:3px 0}.more-card{height:130px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}.more-card .big{position:absolute;right:8px;top:4px;font-size:58px;filter:drop-shadow(4px 5px #0008)}.profile{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px #101112;padding:12px;margin-bottom:18px}.profile .face{font-size:44px}.profile b{font-size:18px}.profile small{display:block;color:var(--muted);font-size:10px}.toast{position:fixed;z-index:20;left:50%;bottom:88px;transform:translateX(-50%);background:#e9f9e3;color:#091408;border:2px solid #8df477;box-shadow:0 4px #287a24;padding:10px 14px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.18s;max-width:90%;text-align:center}.toast.show{opacity:1}.empty{text-align:center;color:var(--muted);padding:28px 8px}.bottom{position:fixed;bottom:0;left:0;right:0;margin:auto;width:min(680px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#202225;border-top:3px solid #34383d;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:10}.bottom button{background:none;color:#d9ddde;font-size:9px;font-weight:900;padding:5px 2px}.bottom span{display:block;font-size:20px;line-height:21px;margin-bottom:2px}.bottom button.on{background:var(--g);color:#071307;border:3px solid #91f47d;box-shadow:0 4px #287a24;transform:translateY(-7px)}@media(max-width:420px){.coin-grid{grid-template-columns:1fr 1fr}.title h1{font-size:25px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="mark">Z</span>ZEXO<em>.</em></div><div class="balance">💎 <span id="balance">120</span> ZC</div></header><main id="main"></main></div><nav class="bottom" id="nav"></nav><div class="toast" id="toast"></div><script>
const packs=[['Mossy Hollow','Fernwick','Fantasy','🌲','32x','4.1 MB','82K'],['Brightbit','Pixelhaus','Cartoon','🟨','16x','1.8 MB','140K'],['Duelist Clear','kovaPVP','PvP','⚔️','16x','1.2 MB','210K'],['Real Stone','Atlas Works','Realistic','🪨','128x','38 MB','96K'],['Cinder Realm','Hollowforge','Fantasy','🔥','32x','5.6 MB','58K'],['Plain Better','mono','Minimal','🟩','16x','0.9 MB','77K']];
const adds=[['Wildlife Pack','Fernwick','Mobs','🦊','New mobs across every biome.'],['Furniture Plus','HomeCraft','Furniture','🪑','Chairs, tables, shelves and lamps.'],['Better Biomes','Atlas Works','Biomes','🌿','Twelve new biomes with plants and weather.'],['Tool Tiers','forgeline','Tools','⛏️','Copper and obsidian tool tiers.'],['Redstone Kit','wireworks','Gameplay','⚡','Switches, timers and sensors.'],['Pet Tales','Nami','Mobs','🐕','Name, dress and train pets.'],['Cozy Cabins','HomeCraft','Furniture','🏠','Cabin parts and fireplaces.'],['Quick Build','forgeline','Tools','🧱','Fill, copy and mirror tools.'],['Hardcore Day','mono','Gameplay','🌋','Longer nights and tougher mobs.']];
const skins=[['Ember Ranger','kovaPVP','🧑🏽‍🚀','Popular'],['Frost Mage','Nami','🧙🏻','New'],['Moss Scout','Fernwick','🧑🏽‍🌾','Popular'],['Neon Courier','Pixelhaus','🧑🏻‍🎤','New'],['Gold Baron','Atlas Works','🧑🏼‍💼','Popular'],['Crimson Knight','Hollowforge','🧑🏽‍⚔️','Popular']];
const products=[['Supporter Badge','Show a green ZEXO badge next to your name.',150,'🏅'],['Dance Floor Emotes','Six new emotes.',300,'💃'],['Pixel Wings Cape','Animated pixel wings.',450,'🪽'],['Name Tag Frames','Ten profile frames.',200,'🏷️'],['Profile Banners','Five artwork banners.',120,'🖼️'],['ZEXO Pass','Early access for 30 days.',800,'🎟️']];
let state={tab:'home',packCat:'All',addCat:'All',q:'',coins:120,owned:[],mine:[0],skin:0,pose:'Standing'};
const nav=[['home','🏠','Home'],['catalog','📦','Catalog'],['character','🧑','Character'],['shop','💎','Shop'],['more','•••','More']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}function chip(list,current,type){return '<div class="chips">'+list.map(x=>'<button class="chip '+(x===current?'on':'')+'" data-a="'+type+'" data-v="'+esc(x)+'">'+x+'</button>').join('')+'</div>'}
function home(){return '<div class="title"><h1>Texture Packs</h1></div><p class="sub">Change how every block looks. Pick a pack and explore the collection.</p>'+chip(['All','Realistic','Cartoon','PvP','Fantasy','Minimal'],state.packCat,'packcat')+'<div class="grid2">'+packs.filter(p=>state.packCat==='All'||p[2]===state.packCat).map((p,i)=>'<button class="card '+(i===0?'wide':'')+'" data-a="pack" data-v="'+packs.indexOf(p)+'"><span class="emoji">'+p[3]+'</span><b>'+p[0]+'</b><small>'+p[4]+' · '+p[6]+' downloads</small></button>').join('')+'</div><div class="section"><h2>Featured</h2><button class="link" data-a="shop">Shop ›</button></div><div class="grid2"><button class="card pink" data-a="shop"><span class="emoji">🪙</span><b>ZEXO Shop</b><small>Coins and digital products</small></button><button class="card blue" data-a="character"><span class="emoji">🧑🏻‍🎤</span><b>Character</b><small>Pick and wear a skin</small></button></div>'}
function catalog(){let arr=adds.filter(a=>(state.addCat==='All'||a[2]===state.addCat)&&a.slice(0,3).join(' ').toLowerCase().includes(state.q.toLowerCase()));return '<div class="title"><h1>Add-ons</h1></div><p class="sub">New mobs, furniture, tools and gameplay changes for your world.</p><div class="search"><input id="search" placeholder="Search add-ons" value="'+esc(state.q)+'"></div>'+chip(['All','Mobs','Furniture','Biomes','Tools','Gameplay'],state.addCat,'addcat')+(arr.length?arr.map((a,i)=>'<div class="row"><div class="ico">'+a[3]+'</div><div class="info"><b>'+a[0]+'</b><small>by '+a[1]+'</small><small>'+a[4]+'</small></div><button class="btn" data-a="add" data-v="'+adds.indexOf(a)+'">'+(state.owned.includes('a'+adds.indexOf(a))?'Added':'Add')+'</button></div>').join(''):'<div class="empty">No add-ons match that search.</div>')}
function character(){let s=skins[state.skin];return '<div class="title"><h1>Character</h1></div><div class="skin-stage"><div class="skin">'+s[2]+'</div><div class="poses">'+['Standing','Walking','Waving'].map(p=>'<button class="'+(state.pose===p?'on':'')+'" data-a="pose" data-v="'+p+'">'+p+'</button>').join('')+'</div></div><div class="section"><h2>'+s[0]+'</h2><small style="color:var(--muted)">by '+s[1]+'</small></div><div class="grid2 skins">'+skins.map((x,i)=>'<button class="skin-card" data-a="skin" data-v="'+i+'"><div class="face">'+x[2]+'</div><b>'+x[0]+'</b><small>'+x[1]+' · '+x[3]+'</small></button>').join('')+'</div><button class="btn" style="width:100%;margin-top:12px" data-a="wear">Wear '+s[0]+'</button>'}
function shop(){return '<div class="title"><h1>Shop</h1></div><p class="sub">Buy ZEXO Coins and spend them on digital products.</p><div class="section"><h2>ZEXO Coins</h2></div><div class="coin-grid">'+[[100,'$0.99'],[550,'$4.99'],[1200,'$9.99'],[2600,'$19.99'],[6000,'$39.99'],[12000,'$79.99']].map(c=>'<div class="coin"><span class="gem">💎</span><b>+'+c[0].toLocaleString()+'</b><small>'+c[1]+'</small><button class="btn" data-a="coin" data-v="'+c[0]+'">Buy</button></div>').join('')+'</div><div class="section"><h2>Digital products</h2></div>'+products.map((p,i)=>'<div class="product"><div class="art">'+p[3]+'</div><div class="info"><b>'+p[0]+'</b><p>'+p[1]+'</p></div><button class="btn" data-a="product" data-v="'+i+'">'+(state.owned.includes('p'+i)?'Owned':p[2]+' ZC')+'</button></div>').join('')}
function more(){return '<div class="title"><h1>More</h1></div><div class="profile"><div class="face">🧑🏻</div><div><b>Guest</b><small>Account · Settings · Help</small></div></div><div class="grid2"><button class="card blue more-card" data-a="msg"><span class="big">👥</span><b>Account</b><small>Sign in and profile</small></button><button class="card gold more-card" data-a="msg"><span class="big">⚙️</span><b>Settings</b><small>Sound, motion, data</small></button><button class="card green more-card" data-a="msg"><span class="big">❔</span><b>Help</b><small>Questions and fixes</small></button><button class="card pink more-card" data-a="msg"><span class="big">ⓘ</span><b>About ZEXO</b><small>Version 1.0</small></button></div><div class="section"><h2>Legal</h2></div><div class="row"><div class="ico">🔒</div><div class="info"><b>Privacy</b><small>Your nickname and demo data stay on this device.</small></div></div><div class="row"><div class="ico">📄</div><div class="info"><b>Terms</b><small>Creators own their packs, add-ons and skins.</small></div></div>'}
function draw(){document.getElementById('main').innerHTML={home,catalog,character,shop,more}[state.tab]();document.getElementById('balance').textContent=state.coins;document.getElementById('nav').innerHTML=nav.map(n=>'<button class="'+(state.tab===n[0]?'on':'')+'" data-a="tab" data-v="'+n[0]+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,v=b.dataset.v;if(a==='tab'||(['shop','character'].includes(a)&&!v)){state.tab=a;draw()}else if(a==='packcat'){state.packCat=v;draw()}else if(a==='addcat'){state.addCat=v;draw()}else if(a==='pack')toast(packs[v][0]+' selected — download integration can be connected next.');else if(a==='add'){let k='a'+v;if(state.owned.includes(k))state.owned=state.owned.filter(x=>x!==k);else state.owned.push(k);draw();toast('Add-on '+(state.owned.includes(k)?'added':'removed'))}else if(a==='skin'){state.skin=+v;draw()}else if(a==='pose'){state.pose=v;draw()}else if(a==='wear')toast('Wearing '+skins[state.skin][0]);else if(a==='coin'){state.coins+=+v;draw();toast('Added '+Number(v).toLocaleString()+' ZC (demo)')}else if(a==='product'){let p=products[v],k='p'+v;if(state.owned.includes(k))toast('You already own this item');else if(state.coins<p[2])toast('Not enough ZC');else{state.coins-=p[2];state.owned.push(k);draw();toast('Purchased '+p[0])}}else if(a==='msg')toast('This section is ready for the next ZEXO backend phase.')});document.addEventListener('input',e=>{if(e.target.id==='search'){state.q=e.target.value;draw();let q=document.getElementById('search');q.focus();q.setSelectionRange(state.q.length,state.q.length)}});draw();
</script></body></html>
